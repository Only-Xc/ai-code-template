[project]
name = "fast-auth"
version = "0.1.0"
description = "Auth and user module for the platform."
requires-python = ">=3.11,<4.0"
dependencies = [
    "emails<1.0,>=0.6",
    "email-validator<3.0.0.0,>=2.1.0.post1",
    "fastapi[standard]>=0.138.1,<1.0.0",
    "fast-core",
    "jinja2<4.0.0,>=3.1.4",
    "pydantic>2.0",
    "pyjwt<3.0.0,>=2.13.0",
    "sqlmodel>=0.0.39,<1.0.0",
]

[tool.uv.sources]
fast-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fast_auth"]
