<!doctype html>
<html>
  <body style="background-color:#fafbfc;font-family:Arial,Helvetica,sans-serif;margin:0;padding:40px 20px;">
    <main style="background:#fff;margin:0 auto;max-width:600px;padding:40px 20px;text-align:center;">
      <h1 style="color:#333;font-size:20px;font-weight:400;">{{ project_name }} - New Account</h1>
      <p style="color:#555;font-size:16px;">Welcome to your new account.</p>
      <p style="color:#555;font-size:16px;">Here are your account details:</p>
      <p style="color:#555;font-size:16px;">Username: {{ username }}</p>
      <p style="color:#555;font-size:16px;">Password: {{ password }}</p>
      <hr style="border:0;border-top:2px solid #ccc;margin:24px 0;">
    </main>
  </body>
</html>
