[project]
name = "fast-items"
version = "0.1.0"
description = "Items module for the platform."
requires-python = ">=3.11,<4.0"
dependencies = [
    "fastapi[standard]>=0.138.1,<1.0.0",
    "fast-auth",
    "fast-core",
    "sqlmodel>=0.0.39,<1.0.0",
]

[tool.uv.sources]
fast-auth = { workspace = true }
fast-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fast_items"]
