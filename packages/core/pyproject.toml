[project]
name = "fast-core"
version = "0.1.0"
description = "Shared core utilities for the platform."
requires-python = ">=3.11,<4.0"
dependencies = [
    "boto3>=1.34.0,<2.0.0",
    "fastapi[standard]>=0.138.1,<1.0.0",
    "pydantic>2.0",
    "pydantic-settings<3.0.0,>=2.2.1",
    "pyjwt<3.0.0,>=2.13.0",
    "pwdlib[argon2,bcrypt]>=0.3.0",
    "redis[hiredis]>=5.0.0,<7.0.0",
    "sqlmodel>=0.0.39,<1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fast_core"]
